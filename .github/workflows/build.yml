name: Build app

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (frontend)
        run: |
          cd frontend
          npm ci
      - name: Dependency audit
        run: |
          cd frontend
          npm audit
      # Artık gerçekten çalışıyor: eslint kuruldu ve eslint.config.js eklendi.
      # Eskiden script vardı ama bağımlılık ve yapılandırma yoktu, yani komut
      # anında patlıyordu — frontend'de hiçbir statik denetim koşmuyordu.
      # Uyarılar (deneysel react-hooks kuralları) CI'ı durdurmaz, hatalar durdurur.
      - name: Lint (eslint)
        run: |
          cd frontend
          npm run lint
      - name: Build
        run: |
          cd frontend
          npm run build
      # Gösterge uyum testi tarayıcı gerektirmiyor ve altın örneğe karşı
      # koşuyor: frontend ile backend aynı sayıları üretmek zorunda
      # (bkz. backend/tests/indicator_parity.json).
      - name: E2E — hesap testleri
        env:
          PW_SKIP_SERVER: "1"
        run: |
          cd frontend
          npx playwright test --project=logic
      - name: E2E — arayüz duman testleri
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npx playwright test --project=browser

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (backend)
        run: |
          cd backend
          python -m pip install -r requirements-dev.txt
          python -m pip check
          pip-audit -r requirements.txt
      - name: Lint (ruff)
        run: |
          cd backend
          ruff check .
      # Uygulamanın import edilebildiğini ayrıca doğrula: import zamanı
      # annotation hataları testlerden önce ve daha anlaşılır şekilde patlasın.
      #
      # Bu adım artık GERÇEKTEN yalnızca import kontrolü: açılış işleri
      # (migration, zamanlayıcı, ağ yoklaması) lifespan'a taşındı, eskiden
      # burada kendiliğinden çalışıyorlardı.
      - name: Import check
        run: |
          cd backend
          python -c "import main"
      # `discover` kullanılıyor, elle yazılmış modül listesi DEĞİL: liste
      # kullanıldığında yeni eklenen test dosyaları sessizce CI dışında
      # kalıyordu (17 modülün yalnızca 7'si koşuyordu).
      - name: Unit tests
        run: |
          cd backend
          python -m unittest discover -s tests -t .
