name: Build app

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies (frontend)
        run: |
          cd frontend
          npm install
      - name: Build Tauri App
        run: |
          cd frontend
          npm run build

  backend-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies (backend)
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff
      - name: Lint (ruff)
        run: |
          cd backend
          ruff check .
      - name: Unit tests
        run: |
          cd backend
          python -m unittest tests.test_rules tests.test_strategy_api tests.test_alerts tests.test_auth_api tests.test_waitlist_api tests.test_admin_api
