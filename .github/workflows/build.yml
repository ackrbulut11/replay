name: Build app

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (frontend)
        run: |
          cd frontend
          npm install
      # `npm run lint` bilinçli olarak çağrılmıyor: eslint kurulu değil ve
      # eslint.config.js yok, script olduğu gibi başarısız oluyor. Tip kontrolü
      # zaten `npm run build` içindeki `tsc` adımında yapılıyor.
      - name: Build
        run: |
          cd frontend
          npm run build

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # backend/.venv 3.9 kullanıyor; CI'ın da aynı sürümde koşması,
          # yalnızca 3.10+ ile çalışan annotation hatalarının burada
          # yakalanmasını sağlıyor (bkz. CLAUDE.md "Annotation evaluation").
          python-version: "3.9"
      - name: Install dependencies (backend)
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff
      - name: Lint (ruff)
        run: |
          cd backend
          ruff check .
      # Uygulamanın import edilebildiğini ayrıca doğrula: import zamanı
      # annotation hataları testlerden önce ve daha anlaşılır şekilde patlasın.
      #
      # Bu adım artık GERÇEKTEN yalnızca import kontrolü: açılış işleri
      # (migration, zamanlayıcı, ağ yoklaması) lifespan'a taşındı, eskiden
      # burada kendiliğinden çalışıyorlardı.
      - name: Import check
        run: |
          cd backend
          python -c "import main"
      # `discover` kullanılıyor, elle yazılmış modül listesi DEĞİL: liste
      # kullanıldığında yeni eklenen test dosyaları sessizce CI dışında
      # kalıyordu (17 modülün yalnızca 7'si koşuyordu).
      - name: Unit tests
        run: |
          cd backend
          python -m unittest discover -s tests -t .
