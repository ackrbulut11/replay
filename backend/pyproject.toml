[tool.poetry]
name = "trading-research-platform-backend"
version = "0.1.0"
description = "FastAPI Backend for Trading Research Platform"
authors = ["Antigravity"]

[tool.poetry.dependencies]
# Gerçek durumu bildirir: `backend/.venv` 3.9, Render modern bir sürüm
# çalıştırıyor ve CI ikisini de test ediyor (bkz. .github/workflows/build.yml).
# Eskiden burada "^3.10" yazıyordu — ne yerelde ne CI'da doğru olan üçüncü bir
# iddia; 3.9'a özgü annotation hataları bu yüzden "olmaması gereken" sayılıp
# gözden kaçıyordu.
#
# 3.11'e tam geçiş AYRI bir iştir: .venv yeniden kurulmalı ve tüm suite orada
# doğrulanmalı. O gün gelene kadar taban 3.9'dur.
python = ">=3.9,<4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
