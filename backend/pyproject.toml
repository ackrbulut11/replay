[tool.poetry]
name = "trading-research-platform-backend"
version = "0.1.0"
description = "FastAPI Backend for Trading Research Platform"
authors = ["Antigravity"]

[tool.poetry.dependencies]
# Python 3.9 2025-10-31'de EOL oldu. Yerel ortam, CI ve Render aynı desteklenen
# tabanda buluşur; yeni backend modüllerindeki future annotations kuralı yine
# korunur çünkü import güvenliği yalnızca sürüm yükseltmeye bırakılmaz.
python = ">=3.11,<4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
